name: PubNarratives Script Engine

on:
  workflow_dispatch:
    inputs:
      index_start:
        description: 'Numéro du prospect de début'
        required: true
        default: '1'
      index_end:
        description: 'Numéro du prospect de fin'
        required: true
        default: '100'

jobs:
  run-generation:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Exécuter la génération des scripts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: 'gemini-3.8-flash'
          INDEX_START: ${{ github.event.inputs.index_start }}
          INDEX_END: ${{ github.event.inputs.index_end }}
          PROSPECTS_CSV: 'Annuaire_300_Prospects.csv'
        run: python agent_scripts.py

      - name: Télécharger les scripts en Artifact ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PubNarratives-Scripts-${{ github.event.inputs.index_start }}-a-${{ github.event.inputs.index_end }}
          path: scripts_output/
